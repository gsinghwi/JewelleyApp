<style>
:root { --p: #7a1f2b; --a: #c9a227; }
body { font: 16px/1.6 "Segoe UI", system-ui, sans-serif; color: #2b2522; max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; background: #fbf9f6; }
h1 { color: var(--p); border-bottom: 3px solid var(--a); padding-bottom: 8px; }
h2 { color: var(--p); margin-top: 2em; }
a { color: var(--p); }
table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 15px; display: block; overflow-x: auto; }
th, td { border: 1px solid #e3dcd3; padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: #f3ece3; }
code { background: #f1ebe4; padding: 1px 5px; border-radius: 4px; font-size: 90%; }
pre { background: #2b2522; color: #f6efe6; padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
pre code { background: none; color: inherit; padding: 0; }
blockquote { border-left: 4px solid var(--a); margin: 1em 0; padding: 4px 16px; background: #fff7e0; }
nav.top { font-size: 14px; margin-bottom: 8px; }
@media print { nav.top { display: none; } body { background: #fff; } }
</style>
